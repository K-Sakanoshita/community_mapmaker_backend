  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #111827;
    }
    main {
      width: min(92vw, 440px);
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }
    p {
      line-height: 1.6;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #9ca3af;
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: #111827;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 11px 14px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .note {
      margin: 8px 0 0;
      color: #4b5563;
      font-size: 0.9rem;
    }
    #message {
      margin-top: 18px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }
    #message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }
    #message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      main { background: #1f2937; border-color: #4b5563; }
      input { background: #111827; color: #f9fafb; border-color: #6b7280; }
      .note { color: #d1d5db; }
    }
  </style>

<body class="site-page site-page--standalone">

    <nav class="header-links" aria-label="サイトメニュー" data-site-i18n-aria-label="サイトメニュー">
      <a id="headerProjectListLink" class="project-list-link" href="./#projects" data-project-list-link><span data-site-i18n="プロジェクト一覧">プロジェクト一覧</span></a>

      <a id="headerLoginLink" class="login-link" href="admin/"><span data-site-i18n="ログイン">ログイン</span> <span aria-hidden="true">↗</span></a>
      <div id="headerSession" class="session-actions" hidden>
        <a id="currentAdmin" class="session-user" href="mypage.html"></a>
        <button id="logoutButton" class="session-logout" type="button"><span data-site-i18n="ログアウト">ログアウト</span></button>
      </div>
    </nav>

<main>
    <h1><span data-site-i18n="パスワード再設定">パスワード再設定</span></h1>
    <p><span data-site-i18n="新しいパスワードを入力してください。">新しいパスワードを入力してください。</span></p>

    <form id="reset-form" novalidate>
      <label for="password"><span data-site-i18n="新しいパスワード">新しいパスワード</span></label>
      <input id="password" name="password" type="password" minlength="8" maxlength="4096" autocomplete="new-password" required>
      <p class="note"><span data-site-i18n="8文字以上で入力してください。">8文字以上で入力してください。</span></p>

      <label for="password-confirmation"><span data-site-i18n="新しいパスワード（確認）">新しいパスワード（確認）</span></label>
      <input id="password-confirmation" name="password_confirmation" type="password" minlength="8" maxlength="4096" autocomplete="new-password" required>

      <button id="submit-button" type="submit"><span data-site-i18n="パスワードを変更">パスワードを変更</span></button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="site-footer-info">
        <span class="site-footer-brand"><span data-site-i18n="コミュニティマップメーカー">コミュニティマップメーカー</span></span>
        <p><span data-site-i18n="運営：Open Across Base">運営：Open Across Base</span><br><span data-site-i18n="問い合わせ：">問い合わせ：</span><a href="mailto:info@openacrossbase.net">info@openacrossbase.net</a></p>
      </div>
      <nav class="site-footer-links" aria-label="フッターメニュー" data-site-i18n-aria-label="フッターメニュー">
        <a href="./"><span data-site-i18n="ホーム">ホーム</span></a>
        <a href="./#projects"><span data-site-i18n="プロジェクト一覧">プロジェクト一覧</span></a>
        <a href="register.html"><span data-site-i18n="ユーザー登録">ユーザー登録</span></a>
        <a href="privacy.html"><span data-site-i18n="プライバシーポリシー">プライバシーポリシー</span></a>
      </nav>
    </div>
  </footer>

  <script>
    (() => {
      'use strict';

      const form = document.getElementById('reset-form');
      const password = document.getElementById('password');
      const confirmation = document.getElementById('password-confirmation');
      const button = document.getElementById('submit-button');
      const message = document.getElementById('message');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';

      // Keep reset tokens out of copied URLs and browser history after loading.
      if (token) {
        const cleanUrl = new URL(location.href); cleanUrl.searchParams.delete('token');
        history.replaceState(null, '', cleanUrl);
      }

      SiteLanguage.onSwitch(url => { if (token && !form.hidden) url.searchParams.set('token', token); });

      const showMessage = (text, type) => {
        message.textContent = text;
        message.className = type;
      };

      if (!/^[a-f0-9]{64}$/.test(token)) {
        form.hidden = true;
        showMessage(SiteLanguage.t('パスワード再設定用のURLが無効、または不完全です。メールに記載されたURLをもう一度開いてください。'), 'error');
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.className = '';
        message.textContent = '';

        if (password.value.length < 8) {
          showMessage(SiteLanguage.t('パスワードは8文字以上で入力してください。'), 'error');
          password.focus();
          return;
        }

        if (password.value !== confirmation.value) {
          showMessage(SiteLanguage.t('確認用パスワードが一致しません。'), 'error');
          confirmation.focus();
          return;
        }

        button.disabled = true;
        button.textContent = SiteLanguage.t('変更中…');

        try {
          const response = await fetch('auth/reset-password.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              token,
              password: password.value,
              password_confirmation: confirmation.value
            })
          });

          let payload = null;
          try {
            payload = await response.json();
          } catch (_) {
            payload = null;
          }

          if (!response.ok) {
            if (payload?.code === 'invalid_or_expired_token') {
              throw new Error(SiteLanguage.t('このパスワード再設定URLは無効か、有効期限が切れています。再度パスワード再設定を申請してください。'));
            }
            if (payload?.code === 'validation_failed') {
              throw new Error(SiteLanguage.t('入力内容を確認してください。'));
            }
            throw new Error(SiteLanguage.t('パスワードを変更できませんでした。時間をおいてもう一度お試しください。'));
          }

          form.hidden = true;
          showMessage(SiteLanguage.t('パスワードを変更しました。新しいパスワードでログインできます。'), 'success');
          password.value = '';
          confirmation.value = '';
        } catch (error) {
          showMessage(error instanceof Error ? error.message : SiteLanguage.t('パスワードを変更できませんでした。'), 'error');
        } finally {
          button.disabled = false;
          button.textContent = SiteLanguage.t('パスワードを変更');
        }
      });
    })();
  </script>
</body>
</html>

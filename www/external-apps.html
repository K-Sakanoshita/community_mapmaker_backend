<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>連携アプリ | Community Map Maker</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="external-apps.css?v=1">
  <script defer src="external-apps.js?v=1"></script>
</head>
<body>
<main class="external-page">
  <p><a href="mypage.html">マイページへ戻る</a></p>
  <h1>連携アプリ</h1>
  <p id="appsStatus" role="status"></p>
  <p id="appsLogin" hidden><a href="admin/?view=mypage">ログインする</a></p>
  <section id="appGrants" hidden>
    <h2>許可したアプリ</h2>
    <ul id="grantList"></ul>
  </section>
  <section id="appRegistry" hidden>
    <h2>登録済みアプリの管理</h2>
    <p>設定の変更や停止を行うと、そのアプリの認可コードとトークンは失効します。</p>
    <ul id="registeredApps"></ul>
    <h3 id="editorTitle">アプリを登録</h3>
    <form id="externalAppForm" method="post">
      <label class="field">クライアント ID<input name="client_id" required maxlength="64" pattern="[a-z0-9][a-z0-9_\-]{0,63}"></label>
      <label class="field">アプリ名<input name="app_name" required maxlength="255"></label>
      <label class="field">許可するオリジン<input name="allowed_origin" type="url" placeholder="https://app.example.net" required maxlength="255"></label>
      <label class="field">認証後の戻り先 URL<input name="redirect_uri" type="url" placeholder="https://app.example.net/oauth/callback/" required maxlength="2048"></label>
      <label class="field">対象プロジェクトキー<input name="app_key" required maxlength="64" pattern="[a-z0-9][a-z0-9_\-]{0,63}"></label>
      <fieldset>
        <legend>許可する API 操作</legend>
        <label><input type="checkbox" name="scopes" value="batch:create"> 一括同期で追加</label>
        <label><input type="checkbox" name="scopes" value="batch:update"> 一括同期で更新</label>
        <label><input type="checkbox" name="scopes" value="batch:delete"> 一括同期で削除</label>
        <label><input type="checkbox" name="scopes" value="activities:create"> 単件投稿を追加</label>
        <label><input type="checkbox" name="scopes" value="activities:update"> 単件投稿を更新</label>
        <label><input type="checkbox" name="scopes" value="activities:delete"> 単件投稿を削除</label>
      </fieldset>
      <p><label><input type="checkbox" name="enabled" checked> 連携を有効にする</label></p>
      <div class="external-actions">
        <button class="primary" type="submit">保存する</button>
        <button id="resetEditor" type="button">新しいアプリを登録</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>

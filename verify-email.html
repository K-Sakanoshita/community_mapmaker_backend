<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>メールアドレスの確認 | Community Map Maker</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: #edf4ef; color: #173f32; font-family: system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 30px; box-sizing: border-box; border-radius: 12px; background: #fff; box-shadow: 0 10px 35px #173f321a; }
    h1 { margin: 0 0 10px; font-size: 1.7rem; } p { line-height: 1.6; } a { color: #126d49; }
    button { padding: 12px 18px; border: 0; border-radius: 6px; background: #16794e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; } .error { color: #a21f1f; }
  </style>
</head>
<body>
<main>
  <h1>メールアドレスの確認</h1>
  <p id="status" role="status" aria-live="polite">下のボタンでメールアドレスを確認してください。</p>
  <button id="verifyButton" type="button">メールアドレスを確認する</button>
  <p><a href="admin/">ログイン画面へ</a></p>
</main>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const token = params.get('token');
history.replaceState(null, '', location.pathname);
const statusText = document.getElementById('status');
const button = document.getElementById('verifyButton');
if (!token || !/^[a-f0-9]{64}$/.test(token)) {
  statusText.textContent = '確認リンクが正しくありません。確認メールを再送してください。';
  statusText.className = 'error';
  button.hidden = true;
}
button.addEventListener('click', async () => {
  button.disabled = true;
  statusText.textContent = '確認中…';
  try {
    const response = await fetch('auth/verify.php?token=' + encodeURIComponent(token), { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
    if (!response.ok) throw new Error('verification_failed');
    statusText.textContent = 'メールアドレスを確認しました。';
    button.hidden = true;
  } catch {
    statusText.textContent = '確認できませんでした。リンクの期限が切れたか、既に使用されています。確認メールを再送してください。';
    statusText.className = 'error';
    button.disabled = false;
  }
});
</script>
</body>
</html>
